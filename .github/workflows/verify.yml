# The workspace's own unit tests on a push to main, docs/ci.md.
name: verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up the workspace
        uses: canmi21/canmi/.github/actions/workspace@main
        with:
          path: ""
          scripts: true

      - name: Run the unit tests
        run: mise run test
