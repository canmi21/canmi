# The scheduled update stages follow docs/ci.md.
name: update-repository

on:
  workflow_call:
    inputs:
      path:
        description: Where the repository sits under repos/, as repos/registry.toml names it, empty for the workspace
        type: string
        default: ""
      runner:
        description: The runner's labels, as JSON
        type: string
        default: '["ubuntu-latest"]'
      nix:
        description: Install Nix first, for a hosted runner and a repository whose check needs it
        type: boolean
        default: false
      beside:
        description: Other repositories the check reads, each cloned at the declared pin or else main beside this one
        type: string
        default: ""
      prepare:
        description: An entry the repository runs before the update, in its own directory
        type: string
        default: ""
      message:
        description: An entry writing the commit message to $RUNNER_TEMP/message, in place of the shared one
        type: string
        default: ""
      wake:
        description: A workflow woken by name once the run ends, as a token's push starts none
        type: string
        default: ""

permissions:
  actions: write
  contents: write

jobs:
  update:
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 60
    env:
      REPOSITORY: ${{ inputs.path }}
      JJ_USER: github-actions[bot]
      JJ_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    defaults:
      run:
        working-directory: ${{ inputs.path == '' && '.' || format('repos/{0}', inputs.path) }}
    steps:
      - name: Check out the workspace and the repository
        uses: canmi21/canmi/.github/actions/workspace@main
        with:
          path: ${{ inputs.path }}
          credentials: true
          scripts: true
          history: true
          nix: ${{ inputs.nix }}
          beside: ${{ inputs.beside }}

      - name: Put jj beside git
        run: node "$GITHUB_WORKSPACE/.github/update/stage.res.mjs" colocate "$REPOSITORY"

      - name: Prepare
        if: inputs.prepare != ''
        run: ${{ inputs.prepare }}

      # The movers read releases through gh and the API, which answer a token more than no one.
      - name: Update
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node "$GITHUB_WORKSPACE/.github/update/stage.res.mjs" update "$REPOSITORY"

      - name: See what moved
        id: moved
        run: node "$GITHUB_WORKSPACE/.github/update/stage.res.mjs" moved "$REPOSITORY"

      # The message names what the update moved, so it is written before the roll adds its own.
      - name: Write the message
        if: steps.moved.outputs.moved == 'true'
        run: ${{ inputs.message || 'node "$GITHUB_WORKSPACE/.github/update/stage.res.mjs" message "$REPOSITORY" "$RUNNER_TEMP/message"' }}

      # What the update moved is a landing on main, its versions rolled as a lander rolls them.
      - name: Roll the versions
        if: steps.moved.outputs.moved == 'true'
        working-directory: .
        run: mise run bump ${REPOSITORY:+"$REPOSITORY"}

      - name: Check
        if: steps.moved.outputs.moved == 'true'
        working-directory: .
        run: mise run check ${REPOSITORY:+"$REPOSITORY"}

      - name: Commit and push
        if: steps.moved.outputs.moved == 'true'
        run: node "$GITHUB_WORKSPACE/.github/update/stage.res.mjs" commit "$REPOSITORY" "$RUNNER_TEMP/message"

      - name: Wake ${{ inputs.wake }}
        if: inputs.wake != ''
        env:
          GH_TOKEN: ${{ github.token }}
          WAKE: ${{ inputs.wake }}
        run: gh workflow run "$WAKE" --repo "$GITHUB_REPOSITORY" --ref main

      # A release source held back fails the run once the rest is committed, naming it.
      - name: Held
        if: ${{ (success() || failure()) && steps.update.outputs.held != '' }}
        env:
          HELD: ${{ steps.update.outputs.held }}
        run: node "$GITHUB_WORKSPACE/.github/update/stage.res.mjs" held "$HELD"
