# The workspace at the root and the calling repository at repos/<path> below it, as they sit at
# home, with the workspace's tools, docs/repos.md. A repository takes it at main.
name: workspace
description: Check out the workspace around the calling repository and install the workspace's tools

inputs:
  path:
    description: Where the calling repository sits under repos/, empty for the workspace
    required: true
  credentials:
    description: Keep the token in the repository's checkout, for a job that pushes to it
    default: "false"
  scripts:
    description: Install the workspace's packages and compile its scripts, for a job that runs one
    default: "false"
  nix:
    description: Install Nix for a repository whose stages need it
    default: "false"
  beside:
    description: Other repositories as space separated owner/repo, cloned at main with packages installed
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: canmi21/canmi
        persist-credentials: ${{ inputs.path == '' && inputs.credentials || 'false' }}
        # The workspace alone is checked whole, its RFCs naming commits of its own history.
        fetch-depth: ${{ inputs.path == '' && '0' || '1' }}
    - if: inputs.path != ''
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: repos/${{ inputs.path }}
        persist-credentials: ${{ inputs.credentials }}
    # mise's monorepo refuses a root none of whose config roots exist, so the workspace alone
    # takes its smallest repository beside it, read by nothing.
    - if: inputs.path == ''
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: monoflake/runtime
        path: repos/monoflake/runtime
        persist-credentials: false
    # A self-hosted runner keeps its tools on its own disk, so only a hosted one caches, docs/ci.md.
    - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
      with:
        working_directory: ${{ inputs.path == '' && '.' || format('repos/{0}', inputs.path) }}
        cache: ${{ runner.environment == 'github-hosted' }}
    - name: install the workspace's packages
      if: inputs.scripts == 'true' || inputs.beside != ''
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: compile the workspace's scripts
      if: inputs.scripts == 'true' || inputs.beside != ''
      shell: bash
      run: mise run build
    - name: install nix
      if: inputs.nix == 'true'
      uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
      with:
        installer-version: 2.35.3 # The installer only bootstraps.
    - name: clone what the stages read beside it
      if: inputs.beside != ''
      shell: bash
      env:
        BESIDE: ${{ inputs.beside }}
      run: node "$GITHUB_WORKSPACE/scripts/deps/scheduled.res.mjs" beside "$BESIDE"
