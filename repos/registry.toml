# Every repository here as `path = "user:repo"`, its path under repos/ any depth. mise.toml's
# config_roots repeats the set, and `mise run check workspace repos` holds the two.
[repos]
"canmi/web" = "canmi21:web"
"canmi/lib" = "canmi21:lib"
"canmi/rfcs" = "canmi21:rfcs"
seam = "canmi21:seam"
"monoflake/platform" = "monoflake:platform"
"monoflake/cloud" = "monoflake:cloud"
"apps/rdm" = "canmi21:rdm"
"apps/cue" = "canmi21:cue"
"apps/still" = "canmi21:still"
# An archive of what was web's console, kept until it is pushed and the copy here is deleted.
console = "monoflake:console"
