# Shared jj rules, layered over the user's own by JJ_CONFIG in mise.toml.

# `jj fix` formats revisions in place, descendants included.
[fix.tools.oxfmt]
command = ["oxfmt", "--stdin-filepath=$path"]
patterns = [
	"glob:'**/*.ts'",
	"glob:'**/*.tsx'",
	"glob:'**/*.mts'",
	"glob:'**/*.cts'",
	"glob:'**/*.js'",
	"glob:'**/*.mjs'",
	"glob:'**/*.cjs'",
	"glob:'**/*.jsx'",
	"glob:'**/*.css'",
	"glob:'**/*.json'",
	"glob:'**/*.jsonc'",
	"glob:'**/*.md'",
	"glob:'**/*.svelte'",
]

[fix.tools.rustfmt]
command = ["rustfmt", "--emit", "stdout"]
patterns = ["glob:'**/*.rs'"]
