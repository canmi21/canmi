# The root of a mise monorepo, a repository's tasks being `//repos/<path>:<task>`.
monorepo_root = true

# repos/registry.toml again, since mise cannot read it; `check workspace repos` holds the two to
# one set.
[monorepo]
config_roots = [
	"repos/canmi/web",
	"repos/canmi/lib",
	"repos/canmi/rfcs",
	"repos/seam",
	"repos/monoflake/platform",
	"repos/monoflake/cloud",
	"repos/monoflake/driver",
	"repos/monoflake/machine",
	"repos/monoflake/runtime",
	"repos/monoflake/egress",
	"repos/apps/rdm",
	"repos/apps/cue",
	"repos/apps/still",
	"repos/console",
]

[env]
# hooks/bin first, so an agent's rm is the guarded one; oxfmt from package.json, to reach svelte.
_.path = ["{{config_root}}/hooks/bin", "{{config_root}}/node_modules/.bin"]

# Where this workspace is, for a repository's task to reach the shared scripts at any depth.
WORKSPACE = "{{config_root}}"

# The user's jj config, then the shared rules in jujutsu.toml.
JJ_CONFIG = "{{env.HOME}}/.config/jj/config.toml:{{config_root}}/jujutsu.toml"

# The toolchain every repository resolves, each pinned to a major that `tools up` moves within.
[tools]
node = "26"
rust = "stable"
pnpm = "12"
jj = "0.46" # pre-1.0, where a minor is the breaking release
oxlint = "1"
# What the workflows part of check lints each workflow with, and what it reads a step's shell with.
actionlint = "1"
shellcheck = "0.11" # pre-1.0, where a minor is the breaking release
# What formats a shell script, reading .editorconfig, docs/lint-format.md.
shfmt = "3"
# What mise reads a task's usage with; without it every task run warns of it missing.
usage = "7"

# One verb, for the workspace alone, a path from repos/registry.toml, or --all for every one.
[tasks.pull]
description = "Fetch the workspace, every repository with --all, or one: `pull [name | --all] [--dry-run]`"
depends = ["build"]
run = "node scripts/workspace/repos.res.mjs pull"

[tasks.push]
description = "Push the workspace's main, every repository's with --all, or one's: `push [name | --all] [--dry-run]`"
depends = ["build"]
run = "node scripts/workspace/repos.res.mjs push"

[tasks.fmt]
description = "Format the workspace, every repository with --all, or one: `fmt [name | --all] [--dry-run]`"
depends = ["build"]
run = "node scripts/workspace/repos.res.mjs fmt"

# `check workspace <part> ...` runs those parts of its own; `--pending` lists rules owed a check.
[tasks.check]
description = "Verify the workspace, every repository with --all, or one: `check [name | --all] [--dry-run]`"
depends = ["build"]
run = "node scripts/workspace/repos.res.mjs verify"

# check, with every warning a failure.
[tasks.audit]
description = "Verify with warnings failing, as check chooses: `audit [name | --all] [--dry-run]`"
depends = ["build"]
env = { AUDIT = "1" }
run = "node scripts/workspace/repos.res.mjs verify"

[tasks.clean]
description = "Clean, which never touches dependencies, as check chooses: `clean [name | --all] [--dry-run]`"
depends = ["build"]
run = "node scripts/workspace/repos.res.mjs clean"

# Kept only where the repository's own verify still passes; --major is handed on.
[tasks.update]
description = "Update, reverting what verify rejects, as check chooses: `update [name | --all] [--dry-run] [--major]`"
depends = ["build"]
run = "node scripts/workspace/repos.res.mjs update"

# What follows the name is the project's own, handed on unread.
[tasks.publish]
description = "Publish one repository, which must be named: `publish <name> [flags]`"
depends = ["build"]
run = "node scripts/workspace/repos.res.mjs publish"

[tasks.repos]
description = "List the registry against the disk, or clone what is missing: `repos list | clone [name] [--dry-run]`"
depends = ["build"]
run = "node scripts/workspace/repos.res.mjs"

[tasks.tools]
description = "The toolchain against its pins and channels: `tools check | outdated | up [name | --all] [--dry-run]`"
depends = ["build"]
run = "node scripts/workspace/tools.res.mjs"

[tasks.each]
description = "Run a task in every repository that declares it, one after another: `each <task> [args] [--dry-run]`"
depends = ["build"]
run = "node scripts/workspace/each.res.mjs"

# An RFC by its id space, the workspace's own or what a repository's `[rfcs] ids` names.
[tasks.rfc]
description = "Start an RFC: `rfc new <name> <area> [--in <path>] [--status S] [--day yyyy-mmdd] [--dry-run]`"
depends = ["build"]
run = "node scripts/rfcs/rfc_new.res.mjs"

[tasks.plan]
description = "What is left in every id space's RFCs, or in one: `plan [space]`"
depends = ["build"]
run = "node scripts/rfcs/rfc_plan.res.mjs"

# The integrator's own scan before a private repository's push, docs/agents/pushing.md.
[tasks.scan]
description = "Count the private identifiers a git diff on stdin adds, the group allowed in a repository apart, and fail on any other: `jj diff --git ... | scan --in <repository>`"
depends = ["build"]
run = "node scripts/workspace/scan.res.mjs"

# What the scripts compile to, never committed, which every task running one depends on.
[tasks.build]
description = "Compile the scripts, the model and the hooks, and remove what no source compiles to"
run = "rescript build && node scripts/prune.res.mjs"
sources = ["scripts/**/*.res", "model/**/*.res", "hooks/**/*.res", "rescript.json"]
outputs = { auto = true }
