# The root of a mise monorepo, a repository's tasks being `//repos/<path>:<task>`.
monorepo_root = true

# repos/registry.toml again, since mise cannot read it; `check workspace repos` holds the two to
# one set. Each ends in `*`, a glob that matches nothing and says nothing where it is not cloned.
[monorepo]
config_roots = [
	"repos/canmi/web*",
	"repos/canmi/lib*",
	"repos/canmi/rfcs*",
	"repos/seam*",
	"repos/monoflake/platform*",
	"repos/monoflake/cloud*",
	"repos/monoflake/driver*",
	"repos/monoflake/machine*",
	"repos/monoflake/runtime*",
	"repos/monoflake/egress*",
	"repos/apps/rdm*",
	"repos/apps/cue*",
	"repos/apps/still*",
	"repos/console*",
]

[env]
# hooks/bin first, so an agent's rm is the guarded one; oxfmt from package.json, to reach svelte.
_.path = ["{{config_root}}/hooks/bin", "{{config_root}}/node_modules/.bin"]

# Where this workspace is, for a repository's task to reach the shared scripts at any depth.
WORKSPACE = "{{config_root}}"

# The user's jj config, then the shared rules in jujutsu.toml.
JJ_CONFIG = "{{env.HOME}}/.config/jj/config.toml:{{config_root}}/jujutsu.toml"

# The toolchain every repository resolves, each pinned to a major that `tools up` moves within.
[tools]
node = "26"
rust = "stable"
pnpm = "12"
jj = "0.46" # pre-1.0, where a minor is the breaking release
oxlint = "1"
# What the workflows part of check lints each workflow with, and what it reads a step's shell with.
actionlint = "1"
shellcheck = "0.11" # pre-1.0, where a minor is the breaking release
# What formats a shell script, reading .editorconfig, docs/toolchain/lint-format.md.
shfmt = "3"
# What mise reads a task's usage with; without it every task run warns of it missing.
usage = "7"
# What runs the Rust tests, each in a process of its own, killing one that hangs, docs/code.md.
"github:nextest-rs/nextest" = { version = "0.9", version_prefix = "cargo-nextest-" } # pre-1.0, where a minor is the breaking release

# One verb, for the workspace alone, a path from repos/registry.toml, or --all for every one.
[tasks.pull]
description = "Fetch the workspace, every repository with --all, or one: `pull [name | --all] [--dry-run]`"
depends = ["build"]
run = "node scripts/workspace/repos.res.mjs pull"

[tasks.push]
description = "Push the workspace's main, every repository's with --all, or one's: `push [name | --all] [--dry-run]`"
depends = ["build"]
run = "node scripts/workspace/repos.res.mjs push"

[tasks.fmt]
description = "Format the workspace, every repository with --all, or one: `fmt [name | --all] [--dry-run]`"
depends = ["build"]
run = "node scripts/workspace/repos.res.mjs fmt"

# `check <name> <part> ...` runs those parts alone and `own` a repository's verify.
# `--pending` lists the rules owed a check.
[tasks.check]
description = "Verify the workspace, every repository with --all, or one: `check [name | --all] [part ...] [--dry-run]`"
depends = ["build"]
run = "node scripts/workspace/repos.res.mjs verify"

# check, with every warning a failure.
[tasks.audit]
description = "Verify with warnings failing, as check chooses: `audit [name | --all] [--dry-run]`"
depends = ["build"]
env = { AUDIT = "1" }
run = "node scripts/workspace/repos.res.mjs verify"

[tasks.clean]
description = "Clean, which never touches dependencies, as check chooses: `clean [name | --all] [--dry-run]`"
depends = ["build"]
run = "node scripts/workspace/repos.res.mjs clean"

# Kept only where the repository's own verify still passes; --major is handed on.
[tasks.update]
description = "Update, reverting what verify rejects, as check chooses: `update [name | --all] [--dry-run] [--major]`"
depends = ["build"]
run = "node scripts/workspace/repos.res.mjs update"

# What follows the name is the project's own, handed on unread.
[tasks.publish]
description = "Publish one repository, which must be named: `publish <name> [flags]`"
depends = ["build"]
run = "node scripts/workspace/repos.res.mjs publish"

[tasks.repos]
description = "List the registry against the disk, or clone what is missing: `repos list | clone [name] [--dry-run]`"
depends = ["build"]
run = "node scripts/workspace/repos.res.mjs"

[tasks.tools]
description = "The toolchain against its pins and channels: `tools check | outdated | up [name | --all] [--dry-run]`"
depends = ["build"]
run = "node scripts/workspace/tools.res.mjs"

[tasks.each]
description = "Run a task in every repository that declares it, one after another: `each <task> [args] [--dry-run]`"
depends = ["build"]
run = "node scripts/workspace/each.res.mjs"

# For Monitor, a line for each progress or failure line a job's output gains and one for a stall.
[tasks.watch]
description = "Watch a job or its output file for Monitor: `watch <job id | file> [--stall <seconds>]`"
depends = ["build"]
run = "node scripts/workspace/runs/watch.res.mjs"

# The run ledger and the watchdog reading it, docs/agents/runs.md.
[tasks.job]
description = "Start a long command in the ledger, or read it: `job start|run [--by <who>] [--limit <seconds>] [--quiet] -- <command> | read <id> | stop <id> | list | table [--since <date>] | events | register <role> <name> [--transcript <file>] | unregister <name> | watchdog | install [--dry-run]`"
depends = ["build"]
run = "node scripts/workspace/runs/job.res.mjs"

# A thread's charter, decision queue, ledger and status, docs/agents/threads.md.
[tasks.thread]
description = "Start a thread's files, or say where they are: `thread new <name> [--dry-run] | where <name> | list | audit <name> | green <name> <step> | seat <name> <seat> [--tooling] | seated <name> <seat> | landed <name> <repository> <commit> <subject>`"
depends = ["build"]
run = "node scripts/workspace/runs/thread.res.mjs"

[tasks.dep]
description = "Add or remove a dependency, a version a day old: `dep add|remove <repository> <package> [--in <path>] [--dev] [--rust] [--dry-run]`"
depends = ["build"]
run = "node scripts/deps/dep/dep.res.mjs"

# Versions roll at a landing on a main line and never in a lane.
[tasks.bump]
description = "Raise what a landing on a main line changes: `bump [name | --all] [--dry-run] [--minor <package>]`"
depends = ["build"]
run = "node scripts/release/versions/bump.res.mjs"

# An RFC by its id space, the workspace's own or what a repository's `[rfcs] ids` names.
[tasks.rfc]
description = "Start an RFC: `rfc new <name> <area> [--in <path>] [--status S] [--day yyyy-mmdd] [--dry-run]`"
depends = ["build"]
run = "node scripts/rfcs/rfc_new.res.mjs"

[tasks.plan]
description = "What is under way, ready, waiting and done, then the RFCs: `plan [space] [--done]`"
depends = ["build"]
run = "node scripts/rfcs/rfc_plan.res.mjs"

# model/reference, the rules written out of the model, held by the generated part.
[tasks.docs]
description = "Write model/reference/rules.md from the model"
depends = ["build"]
run = "node checks/placed/docs/reference.res.mjs"

# The integrator's own scan before a private repository's push, docs/agents/pushing.md.
[tasks.compare]
description = "Compare an edited doc with its original on headings, bold leads and code spans: `compare <original> <edited>`"
depends = ["build"]
run = "node scripts/docs/doc_compare.res.mjs"

[tasks.scan]
description = "Count the private identifiers a git diff on stdin adds, the group allowed in a repository apart, and fail on any other: `jj diff --git ... | scan --in <repository>`"
depends = ["build"]
run = "node scripts/workspace/push/scan.res.mjs"

# What the scripts compile to, never committed, which every task running one depends on.
[tasks.build]
description = "Compile the scripts, the model, the hooks and the CI entries, and remove what no source compiles to"
run = "rescript build && node scripts/prune/prune.res.mjs"
sources = ["scripts/**/*.res", "model/**/*.res", "checks/**/*.res", "hooks/**/*.res", ".github/**/*.res", "rescript.json"]
outputs = { auto = true }

# The workspace's own unit tests, fake data alone, reading no repository under repos/.
[tasks.test]
description = "Run the workspace's unit tests over scripts, model and hooks"
depends = ["build"]
run = "pnpm exec vitest run"

# A lane of an implementer, opened and closed with its jj workspaces, docs/agents/lanes.md.
[tasks.lane]
description = "Open, close, judge, check or take a lane: `lane open <repository|workspace> <name> [--with <repository>] | close <name> | handed <name> [--own <directory>] | check <part> ... | take <name> [--in <repository>] [--dry-run]`"
depends = ["build"]
run = "node scripts/workspace/lane/lane.res.mjs"

# The records of friction summed by rule id, docs/agents/friction.md.
[tasks.friction]
description = "Sum the records of friction by rule id: `friction [--in <directory>]`"
depends = ["build"]
run = "node scripts/workspace/lane/friction.res.mjs"
