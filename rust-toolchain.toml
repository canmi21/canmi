# The Rust toolchain every repository below resolves. Written by `mise run update` from
# `rust = "stable"` in mise.toml, never by hand -- `mise run verify` fails when the two disagree.
#
# It lives here rather than in a project for the same reason .editorconfig does: rustup walks up
# from the crate it is invoked in, so one file covers all of them. It arrived with the governor
# repository, which carried its own copy pinned to an older compiler.
#
# The channel rather than a version number, see spec/toolchain.md, "`rust-toolchain.toml` is
# generated too".
[toolchain]
channel = "stable"
components = ["rustfmt", "clippy", "rust-src"]
